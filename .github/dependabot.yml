version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Type declarations must match the oldest supported Node.js runtime.
      - dependency-name: '@types/node'
        versions: ['>=23']
      # typescript-eslint currently supports TypeScript versions below 6.1.
      - dependency-name: typescript
        versions: ['>=6.1']
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
